[project]
name = "ai-customer-support"
version = "0.1.0"
description = "Agentic AI customer support ticket system - backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg>=0.29",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "arq==0.28.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    "fastembed>=0.4",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
