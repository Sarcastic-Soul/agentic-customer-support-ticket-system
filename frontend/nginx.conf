# Mirrors vite.config.ts's dev proxy (server.proxy) so the built SPA talks
# to the api container the same way `pnpm dev` talks to localhost:8000.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # voice notes upload through /channels/voice/upload
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /dev/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location /channels/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback - TanStack Router's client-side routes have no matching
    # file on disk.
    location / {
        try_files $uri /index.html;
    }
}
