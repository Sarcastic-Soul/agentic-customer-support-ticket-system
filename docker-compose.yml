# One command for the whole stack: `docker compose up -d --build`, then open
# http://localhost:5173. Your own keys go in .env (copy .env.example); with no
# .env at all it still runs, on the offline stub model.

# Shared by setup, api and worker - same image, different command. The
# environment block points them at the containers instead of localhost.
x-backend: &backend
  build: ./backend
  image: ai-customer-support-backend
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
    CHECKPOINT_DATABASE_URL: postgresql://support:support@postgres:5432/support
    REDIS_URL: redis://redis:6379/0
    # Embedding + reranker models download once into the shared volume
    # instead of once per container.
    FASTEMBED_CACHE_PATH: /root/.cache/fastembed
  volumes:
    - models:/root/.cache
  # lets LANGFUSE_HOST=http://host.docker.internal:3001 reach a Langfuse
  # running on the host (Linux needs this mapping; Mac/Windows have it)
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support}
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support} -d ${POSTGRES_DB:-support}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb
    restart: unless-stopped
    environment:
      PGWEB_DATABASE_URL: postgres://support:support@postgres:5432/support?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    depends_on:
      - postgres

  # ---- the app: one-shot setup, then api + worker + frontend. Native
  # `make dev` users run `make up`, which starts only the three services
  # above. ----

  # Extensions + migrations (docker-entrypoint.sh), then seed + ingest only
  # if the database is empty (app/seed/bootstrap.py). Exits when done; api
  # and worker wait for it.
  setup:
    <<: *backend
    command: python -m app.seed.bootstrap
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on: &after-setup
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: arq app.workers.settings.WorkerSettings
    depends_on: *after-setup

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  pgdata:
  models:
