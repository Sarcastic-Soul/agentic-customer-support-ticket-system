services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support}
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support} -d ${POSTGRES_DB:-support}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb
    restart: unless-stopped
    environment:
      PGWEB_DATABASE_URL: postgres://support:support@postgres:5432/support?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  # ---- everything below is opt-in (`docker compose --profile app up -d`,
  # or `make docker-up`) - native `make dev` users get only postgres/redis/
  # pgweb above, exactly as before. This profile is for running the whole
  # stack with nothing installed but Docker. ----

  api:
    profiles: [app]
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
      CHECKPOINT_DATABASE_URL: postgresql://support:support@postgres:5432/support
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: [app]
    build: ./backend
    command: arq app.workers.settings.WorkerSettings
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
      CHECKPOINT_DATABASE_URL: postgresql://support:support@postgres:5432/support
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: [app]
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
